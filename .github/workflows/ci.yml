name: CI

on:
  push:
    branches:
      - main
      - master

  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_USER: lol_timer
          POSTGRES_PASSWORD: lol_timer
          POSTGRES_DB: lol_timer

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U lol_timer -d lol_timer"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:8

        ports:
          - 6379:6379

        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://lol_timer:lol_timer@localhost:5432/lol_timer?sslmode=disable

      REDIS_ADDRESS: localhost:6379
      REDIS_PASSWORD:
      REDIS_DATABASE: 0

      NATS_URL: nats://localhost:4222

      ROOM_CACHE_TTL: 10m
      HTTP_ADDRESS: :8080
      LOG_LEVEL: info

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"

          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: Run unit tests
        run: go test ./... -race

      - name: Start NATS JetStream
        run: |
          docker run \
            --detach \
            --name nats-ci \
            --publish 4222:4222 \
            --publish 8222:8222 \
            nats:2.11-alpine \
            -js \
            -m 8222

      - name: Wait for NATS
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8222/healthz > /dev/null; then
              exit 0
            fi

            sleep 1
          done

          docker logs nats-ci
          exit 1

      - name: Install migration tool
        run: |
          go install \
            -tags postgres \
            github.com/golang-migrate/migrate/v4/cmd/migrate@v4.18.3

      - name: Apply database migrations
        run: migrate -path migrations -database "$DATABASE_URL" up

      - name: Run integration tests
        env:
          TEST_DATABASE_URL: postgres://lol_timer:lol_timer@localhost:5432/lol_timer?sslmode=disable
        run: go test -tags=integration ./... -count=1 -p=1

      - name: Build
        run: go build ./...
