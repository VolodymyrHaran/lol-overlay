apiVersion: v1
kind: Service
metadata:
  name: champion-service
  namespace: lol-overlay
  labels:
    app.kubernetes.io/name: champion-service
    app.kubernetes.io/part-of: lol-overlay
spec:
  selector:
    app.kubernetes.io/name: champion-service
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: champion-service
  namespace: lol-overlay
spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: champion-service

  template:
    metadata:
      labels:
        app.kubernetes.io/name: champion-service
        app.kubernetes.io/part-of: lol-overlay
    spec:
      containers:
        - name: champion-service
          image: lol-overlay/champion-service:local
          imagePullPolicy: IfNotPresent

          env:
            - name: CHAMPION_GRPC_ADDRESS
              value: "0.0.0.0:50051"

            - name: LOG_LEVEL
              valueFrom:
                configMapKeyRef:
                  name: lol-overlay-config
                  key: LOG_LEVEL

          ports:
            - name: grpc
              containerPort: 50051

          readinessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6

          livenessProbe:
            grpc:
              port: 50051
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi