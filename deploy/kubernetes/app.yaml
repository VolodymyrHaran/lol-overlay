apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: lol-overlay
  labels:
    app.kubernetes.io/name: app
    app.kubernetes.io/part-of: lol-overlay
spec:
  type: NodePort

  selector:
    app.kubernetes.io/name: app

  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: lol-overlay
spec:
  replicas: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: app

  template:
    metadata:
      labels:
        app.kubernetes.io/name: app
        app.kubernetes.io/part-of: lol-overlay
    spec:
      containers:
        - name: app
          image: lol-overlay/app:v1
          imagePullPolicy: IfNotPresent

          envFrom:
            - configMapRef:
                name: lol-overlay-config

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lol-overlay-secrets
                  key: DATABASE_URL

            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lol-overlay-secrets
                  key: REDIS_PASSWORD

          ports:
            - name: http
              containerPort: 8080

          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi