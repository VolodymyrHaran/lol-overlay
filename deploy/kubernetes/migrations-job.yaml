apiVersion: batch/v1
kind: Job
metadata:
  name: database-migrations
  namespace: lol-overlay
  labels:
    app.kubernetes.io/name: database-migrations
    app.kubernetes.io/part-of: lol-overlay
spec:
  backoffLimit: 4

  template:
    metadata:
      labels:
        app.kubernetes.io/name: database-migrations
        app.kubernetes.io/part-of: lol-overlay
    spec:
      restartPolicy: OnFailure

      containers:
        - name: migrations
          image: lol-overlay/migrations:local
          imagePullPolicy: IfNotPresent

          args:
            - -database
            - $(DATABASE_URL)
            - up

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: lol-overlay-secrets
                  key: DATABASE_URL

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi