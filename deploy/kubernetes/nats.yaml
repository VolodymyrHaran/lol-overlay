apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: lol-overlay
  labels:
    app.kubernetes.io/name: nats
    app.kubernetes.io/part-of: lol-overlay
spec:
  selector:
    app.kubernetes.io/name: nats
  ports:
    - name: client
      port: 4222
      targetPort: client

    - name: monitoring
      port: 8222
      targetPort: monitoring

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: lol-overlay
spec:
  serviceName: nats
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: nats

  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
        app.kubernetes.io/part-of: lol-overlay
    spec:
      containers:
        - name: nats
          image: nats:2.11-alpine
          imagePullPolicy: IfNotPresent

          args:
            - --jetstream
            - --store_dir=/data
            - --http_port=8222

          ports:
            - name: client
              containerPort: 4222

            - name: monitoring
              containerPort: 8222

          readinessProbe:
            httpGet:
              path: /healthz
              port: monitoring
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /healthz
              port: monitoring
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi

          volumeMounts:
            - name: nats-data
              mountPath: /data

  volumeClaimTemplates:
    - metadata:
        name: nats-data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi